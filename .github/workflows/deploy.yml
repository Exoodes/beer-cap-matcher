name: Automate Backend Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

# One deploy at a time: two quick merges mustn't build side by side (each
# build needs several GB of disk on the VPS).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/deploy/apps/beer-cap-matcher
            # Stop rather than merge if the checkout on the VPS has diverged.
            git pull --ff-only origin master
            docker compose -f docker-compose.prod.yml up -d --build
            # Fail the workflow unless the new api gets healthy (its health
            # check allows a 600 s start period; wait up to 15 min).
            # Not `up --wait`: some Compose versions fail it when the
            # one-off init_db exits, even with 0.
            for i in $(seq 90); do
              status=$(docker inspect -f '{{.State.Health.Status}}' beercap_api)
              [ "$status" = healthy ] && break
              [ "$status" = unhealthy ] && { echo "api is unhealthy"; exit 1; }
              sleep 10
            done
            [ "$status" = healthy ] || { echo "api not healthy after 15 min"; exit 1; }
            # The replaced image is now untagged; remove it so old images
            # don't fill the disk. Never touches volumes or images in use.
            docker image prune -f
